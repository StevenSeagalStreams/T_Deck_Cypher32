; Cypher32 for the LilyGo T-Deck (ESP32-S3 + SX1262 + 320x240 TFT + keyboard)
;
;   pio run                build every range profile for the T-Deck
;   pio run -e long        build just the default one
;   pio run -e long -t upload
;   pio device monitor     watch the LORA_DEBUG trace
;
; The game, the radio protocol and the web portal are Cypher32's, unchanged, so
; a T-Deck plays against Heltec Wireless Papers running the same range profile.
; The original board still builds from this tree: heltec_fast / heltec_long /
; heltec_epic below.
;
; DNSServer, ESPmDNS, WebServer, Preferences, SPI and Wire all ship with the
; Arduino ESP32 core, so the only external dependencies are RadioLib and the
; display driver.

[platformio]
; The sketch and its headers live at the repository root so the Arduino IDE can
; open cypher32.ino with everything beside it. PlatformIO defaults to src/, so
; point it here and exclude everything that is not firmware — test/ contains
; host-only code with its own main().
src_dir = .
default_envs = long

[env]
platform  = espressif32 @ ^6.5.0
framework = arduino

; Include everything at the root, then take back the directories that are not
; firmware. Naming the sketch directly does NOT work: PlatformIO converts it to
; cypher32.ino.cpp before the filter runs, so `+<cypher32.ino>` matches nothing
; and the build ends with "Nothing to build" having said it converted the file
; one line earlier.
build_src_filter =
    +<*>
    -<test/>
    -<docs/>
    -<tools/>
    -<web/>
    -<boards/>
    -<variants/>
    -<.git/>

; Turns the four parts PlatformIO produces into one image a browser can flash.
extra_scripts = post:tools/merge_firmware.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; ── Boards ───────────────────────────────────────────────────────────────────
[tdeck]
; Defined in boards/ — platform-espressif32 has no T-Deck.
board = lilygo_t_deck
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DCYPHER32_TDECK
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3

[heltec]
board = heltec_wireless_paper
board_build.partitions   = default_8MB.csv
board_build.variants_dir = variants
build_flags = -DCYPHER32_HELTEC
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    https://github.com/todd-herbert/heltec-eink-modules.git

; ── Range profiles ───────────────────────────────────────────────────────────
; Every device in one game must run the SAME profile — a different spreading
; factor or frequency is not a weak link, it is deafness. See the table in
; README.md and the reasoning in cypher32_packets.h. That applies across boards
; too: a T-Deck on LONG plays with a Wireless Paper on LONG.
[env:fast]
extends = tdeck
build_flags = ${tdeck.build_flags} -DLORA_PROFILE=LORA_PROFILE_FAST

[env:long]
extends = tdeck
build_flags = ${tdeck.build_flags} -DLORA_PROFILE=LORA_PROFILE_LONG

[env:epic]
extends = tdeck
build_flags = ${tdeck.build_flags} -DLORA_PROFILE=LORA_PROFILE_EPIC

[env:heltec_fast]
extends = heltec
build_flags = ${heltec.build_flags} -DLORA_PROFILE=LORA_PROFILE_FAST

[env:heltec_long]
extends = heltec
build_flags = ${heltec.build_flags} -DLORA_PROFILE=LORA_PROFILE_LONG

[env:heltec_epic]
extends = heltec
build_flags = ${heltec.build_flags} -DLORA_PROFILE=LORA_PROFILE_EPIC
