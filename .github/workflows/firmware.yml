# Build the T-Deck firmware for the real target, and publish a browser flasher.
#
# Until this existed, nothing in this repository had ever compiled cypher32.ino
# for an ESP32. The host test suite compiles the sketch against stubs, which
# catches a great deal, but it cannot catch anything that depends on the real
# toolchain, the real Arduino core, or the real libraries. This job does.
#
# It also produces what the flasher needs: one merged image per range profile,
# with the offsets taken from PlatformIO rather than guessed.
name: firmware

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**/*.md", "docs/img/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    # Cheap and fast, and it fails for different reasons than the firmware
    # build does, so it is worth knowing which of the two broke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          npm install --no-save --silent playwright
          npx --yes playwright install --with-deps chromium
      - name: Lint, unit tests, every range profile
        working-directory: test
        run: make lint && make run && make profiles
      - name: T-Deck app played through its own controls
        working-directory: test
        run: make tdeck
      - name: Flasher page
        working-directory: test
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node test_flasher.js

  arduino-ide:
    # The Arduino IDE builds differently from PlatformIO: it runs its own
    # preprocessor over the .ino, which writes a prototype for every function
    # above the first one. A type declared further down then "does not name a
    # type" in the IDE while building fine everywhere else — which is exactly
    # how a broken build once reached a player. This builds the sketch the
    # way the IDE does, with the settings the README tells people to use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cypher32
      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Cache the ESP32 core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.2.0-v1
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib install RadioLib "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"
      - name: Build as the Arduino IDE does (ESP32S3 Dev Module, OPI PSRAM, 16 MB)
        run: |
          rm -rf cypher32/test
          arduino-cli compile --fqbn \
            "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc" \
            cypher32

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [fast, long, epic]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The toolchain and the Arduino core are hundreds of megabytes and do not
      # change between runs; without this every build re-downloads them.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python3 -m pip install --quiet platformio

      - name: Build ${{ matrix.profile }}
        run: pio run -e ${{ matrix.profile }}

      - name: Report flash and RAM use
        run: |
          echo "### ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ".pio/build/${{ matrix.profile }}/parts-${{ matrix.profile }}.json" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cypher32-${{ matrix.profile }}
          path: |
            .pio/build/${{ matrix.profile }}/cypher32-${{ matrix.profile }}.bin
            .pio/build/${{ matrix.profile }}/parts-${{ matrix.profile }}.json
          if-no-files-found: error

  site:
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pinned. The board check imports this from our own origin, so the page
      # does not depend on a CDN being reachable to tell someone what they are
      # about to overwrite.
      - name: Fetch esptool-js
        run: |
          set -euo pipefail
          npm pack esptool-js@0.7.0 --silent >/dev/null
          tar xzf esptool-js-0.7.0.tgz
          test -s package/bundle.js

      - name: Assemble the flasher
        run: |
          set -euo pipefail
          version=$(grep -oP 'FIRMWARE_VERSION\s+"\K[^"]+' cypher32_packets.h)
          echo "firmware $version"
          python3 tools/make_manifest.py --artifacts artifacts --out site \
            --version "$version" --commit "$GITHUB_SHA" \
            --esptool package/bundle.js \
            --summary "$GITHUB_STEP_SUMMARY"
          ls -la site

      - uses: actions/upload-artifact@v4
        with:
          name: flasher-site
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Separate from the build on purpose. Publishing needs Pages switched on
    # for the repository with its source set to GitHub Actions; until someone
    # does that this job fails and the firmware build above still succeeds,
    # with the flasher downloadable as an ordinary artifact.
    needs: site
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
