# Keep the World Board awake.
#
# Supabase pauses a free project after about a week without traffic, and a
# paused project does not answer at all: every T-Deck then reports that it
# cannot reach the board. One read of the public standings a day counts as
# traffic and keeps it running, even when nobody is playing online.
#
# (GitHub itself switches scheduled workflows off after 60 days without a
# commit to the repository; if that happens, re-enable this one under
# Actions, or run it by hand with "Run workflow".)
name: board-keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the board
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST \
            "https://rxpodxloxbybkbystqzd.supabase.co/rest/v1/rpc/c32_board" \
            -H "apikey: sb_publishable_ADPGpjk7sfQtalWVQE3Ejw_niOaUZAj" \
            -H "Content-Type: application/json" \
            -d '{"p_limit":1}'
          echo
